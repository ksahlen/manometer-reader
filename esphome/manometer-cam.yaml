# ESPHome configuration for the manometer camera prototype.
#
# Hardware target:
#   Prokyber AI-On-The-Edge-Cam, ESP32-S3 with PoE, SD, OV2640 camera,
#   and 4 x WS2812B back-lighting LEDs.
#
# Ethernet/PoE pins are intentionally not configured yet. Until those pins are
# confirmed, the prototype uses Wi-Fi and the camera snapshot endpoint.
#
# The camera pinout follows the Prokyber schematic signal names:
#   CAM_Y2..CAM_Y9 are used as ESPHome data_pins D0..D7.
#
# Flash with: esphome run manometer-cam.yaml

substitutions:
  device_name: radiator-pressure-ai
  friendly_name: radiator-pressure-ai
  snapshot_port: "8080"
  stream_port: "8081"

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  on_boot:
    priority: 800
    then:
      - switch.turn_on: peripheral_enable

esp32:
  board: esp32-s3-devkitc-1
  flash_size: 16MB
  framework:
    type: esp-idf

psram:
  mode: octal
  speed: 80MHz

logger:
  level: INFO

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid_ranas
  password: !secret wifi_password_ranas

  manual_ip:
    static_ip: 192.168.6.35
    gateway: 192.168.6.1
    subnet: 255.255.255.0

  ap:
    ssid: "Radiator-Pressure-Ai"
    password: !secret fallback_ap_password

captive_portal:

mdns:

# --- Camera ---
esp32_camera:
  name: ${friendly_name}
  # Prokyber AI-On-The-Edge-Cam / OV2640 pin mapping
  external_clock:
    pin: GPIO15
    frequency: 20MHz
  i2c_pins:
    sda: GPIO4
    scl: GPIO5
  data_pins:
    - GPIO11  # D0 / CAM_Y2
    - GPIO9   # D1 / CAM_Y3
    - GPIO8   # D2 / CAM_Y4
    - GPIO10  # D3 / CAM_Y5
    - GPIO47  # D4 / CAM_Y6
    - GPIO18  # D5 / CAM_Y7
    - GPIO17  # D6 / CAM_Y8
    - GPIO16  # D7 / CAM_Y9
  vsync_pin: GPIO6
  href_pin: GPIO7
  pixel_clock_pin: GPIO13

  resolution: 1280x1024
  jpeg_quality: 10        # Lower = better quality (6-63)
  frame_buffer_count: 1
  max_framerate: 1fps
  # Keep a reasonably fresh frame available for light-pulsed snapshots.
  idle_framerate: 1fps
  vertical_flip: false
  horizontal_mirror: false

# HTTP endpoint for snapshots: http://<ip>:8080/
# Optional focus/framing stream: http://<ip>:8081/
esp32_camera_web_server:
  - port: ${snapshot_port}
    mode: snapshot
  - port: ${stream_port}
    mode: stream

# Built-in web UI at http://<ip>:80/
web_server:
  port: 80

# --- Back-lighting ---
light:
  - platform: esp32_rmt_led_strip
    id: backlight
    name: "Backlight"
    pin: GPIO12
    num_leds: 4
    rgb_order: GRB
    chipset: WS2812
    restore_mode: ALWAYS_OFF

# --- Board power enables ---
switch:
  - platform: gpio
    id: peripheral_enable
    pin: GPIO46
    restore_mode: ALWAYS_ON
    internal: true

# --- Diagnostics ---
binary_sensor:
  - platform: status
    name: "Status"

sensor:
  - platform: wifi_signal
    name: "WiFi Signal"
    update_interval: 60s

  - platform: uptime
    name: "Uptime"

text_sensor:
  - platform: wifi_info
    ip_address:
      name: "IP Address"

button:
  - platform: restart
    name: "Restart"
