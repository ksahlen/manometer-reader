# Manometer Reader Configuration

camera:
  # ESP32-CAM snapshot URL (ESPHome camera web server)
  url: "http://192.168.6.35:8080/"
  timeout: 10
  # Rotate image clockwise before analysis. Use 90 or 270 when the camera is
  # mounted sideways. ESPHome itself only flips/mirrors the camera image.
  rotate_degrees: 0

lighting:
  # Pulse the ESPHome WS2812B backlight before each snapshot.
  enabled: true
  base_url: "http://192.168.6.35"
  entity_name: "Backlight"
  # ESPHome web API uses 0-255 values for brightness and RGB.
  brightness: 64
  red: 255
  green: 255
  blue: 255
  transition: 0
  settle_seconds: 0.5
  timeout: 5
  turn_off_after_snapshot: true

calibration:
  # Needle angle (0=up, clockwise) at 0 bar on the gauge
  angle_0bar: 229.3
  # Total angular sweep from 0 bar to max bar (clockwise)
  total_sweep: 250.7
  # Maximum value on the gauge scale
  max_bar: 3.0

reading:
  # Seconds between readings
  interval_seconds: 300
  # Minimum detection confidence (0-1) to accept a reading
  min_confidence: 0.3
  # Number of readings to median-filter over
  median_window: 5
  # Save annotated debug images
  save_debug_images: false
  # Save raw snapshots before analysis. Defaults to save_debug_images if omitted.
  save_raw_images: false
  debug_image_dir: "/tmp/manometer-debug"

mqtt:
  host: "192.168.4.11"
  port: 1883
  # Leave blank if the broker does not require authentication.
  username: ""
  password: ""
  client_id: "manometer-reader"
  topic_prefix: "manometer"
  device_name: "Radiatortryck"
